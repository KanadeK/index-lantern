[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "index-lantern"
version = "0.1.1"
description = "Inspect raw differences hidden behind Git index flags"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
index-lantern = "index_lantern.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/index-lantern"
Issues = "https://github.com/KanadeK/index-lantern/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
